[project]
name = "dps-cyclic"
version = "0.1.0"
description = "DPS with CycleGAN/UVCGAN generators as measurement operators"
requires-python = ">=3.11"
# NOTE: the upstream requirements.txt is a 2022 `pip freeze` (cp38-cp310 wheels
# only, and missing torch/torchvision/lpips/scikit-image which the code imports).
# It is kept for reference but is not the source of truth; these are.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6",
    "matplotlib>=3.7",
    "pillow>=10",
    "scipy>=1.11",
    "tqdm>=4.65",
    "scikit-image>=0.22",  # util/compute_metric.py
    "lpips>=0.1.4",        # util/compute_metric.py
    "tifffile>=2024.1.1",  # EM data is often TIFF
]

# torch is deliberately NOT a project dependency: on Colab / the cluster it is
# supplied by the environment with CUDA already wired up. Locally we take the
# CPU build via the `cpu` group so nothing tries to pull a CUDA stack onto a
# machine without an NVIDIA GPU.
[dependency-groups]
cpu = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
default-groups = ["cpu", "dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
