# Must match the schedule train_diffusion.py was run with.
sampler: ddpm
steps: 1000
noise_schedule: linear
model_mean_type: epsilon
# fixed_small (not learned_range) because the prior is trained learn_sigma: False.
model_var_type: fixed_small
dynamic_threshold: False
clip_denoised: True
rescale_timesteps: False
# Lower this (e.g. "100") for faster sampling during development.
timestep_respacing: 1000
