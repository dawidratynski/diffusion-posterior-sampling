# VALIDATION experiment: reconstruct a held-out REAL image from its own
# synth-domain projection.
#
# sample_condition.py computes y = A(ref_img) itself, so ref_img must be a real
# image and y = G_{R->S}(r_gt) is its synthetic projection. Reconstructions are
# scored against the known r_gt.
#
# For the actual product -- generating realistic images from synthetic inputs
# with known lattice parameters -- use scripts/generate_augmented.py, which
# takes synthetic images directly as the measurement.
#
# NOTE this benchmark structurally favours the UVCGAN baseline: gen_ab was
# trained with a cycle loss to invert gen_ba. Report that caveat.

conditioning:
  method: ps
  params:
    # Tuned on the FINAL prior (synth-pretrained + real-finetuned) with the
    # gamma=0.4 stand-in operator at a 250-step schedule, over 24 distinct
    # photos x 2 variants. Re-tune when the real UVCGAN operator lands: the
    # optimum depends on both the operator and the prior.
    #
    #   scale          1.0     1.5     2.0
    #   spacing err    .000    .000    .000    (all at the measurement floor)
    #   signature err  .027    .022    .018
    #   prominence      809     856    1193    <- real target 1537
    #   diversity      .412    .347    .243    <- see below
    #   NN dist       1.139   1.125   1.129    (floor 1.113; all clear)
    #
    # 2.0 chosen: closest to the real prominence target, best label validity,
    # and judged closest to the reference images by eye. Its lower diversity is
    # not a cost -- calibration shows two crops of the SAME real photo differ by
    # 0.088 RMSE and two DIFFERENT real photos by 0.144, so 0.243 is already
    # 1.7x the real photo-to-photo spread. Scale 1.0's 0.412 is over-dispersion,
    # consistent with its prominence sitting 47% below real.
    scale: 2.0

data:
  name: crystal
  root: ../dataset/real/val   # REAL images: the prior's domain
  image_size: 160

measurement:
  operator:
    name: cyclegan
    # 'stub' lets the whole pipeline run before real weights exist.
    # Switch to framework: uvcgan2 + path: <uvcgan2 output dir> when they land.
    framework: stub
    # real -> synth. This is the operator DPS inverts; the imperfections it
    # discards are exactly what the R prior fills back in.
    direction: ba
    # Calibrated so the stand-in's output prominence matches the synth domain
    # (~12k) rather than overshooting it 20x. See SpectralIdealizer's docstring.
    # Ignored once framework: uvcgan2 replaces the stand-in.
    gamma: 0.4

  noise:
    # The synthetic conditioning target is known exactly -- there is no
    # measurement noise. Operator error is absorbed by `scale`.
    name: clean
